[project]
name = "gatra"
version = "0.1.0"
description = "Indonesia-first small language model from first principles"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.2.0",
    "torch>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
data = ["datasets>=3.0.0", "huggingface-hub>=0.26.0", "zstandard>=0.23.0"]
# BPE-32k (T1): hanya dibutuhkan saat data.tokenizer menunjuk tokenizer.json.
# Byte path (tokenizer="byte") jalan tanpa extra ini.
bpe = ["tokenizers>=0.21.0"]

[project.scripts]
gatra-train = "gatra.train:main"
gatra-continue = "gatra.continue_train:main"
gatra-generate = "gatra.generate:main"
gatra-prepare = "gatra.prepare:main"
gatra-identity = "gatra.identity:main"
gatra-build = "gatra.build:main"
gatra-train-tokenizer = "gatra.scripts.train_tokenizer_300m:main"
gatra-fertility-gate = "gatra.scripts.fertility_gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatra"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
