name = "gatra-10m"
seed = 1337
device = "auto"

[data]
# Build once with `gatra-build --config configs/gatra-10m.toml`; training reads the bins.
bin_dir = "data/bin/gatra-10m"
val_ratio = 0.1
dedup = true

# path = weight. Earlier sources win dedup ties. Missing files fail the build.
[data.mix]
"data/gatra-identity.jsonl" = 20.0
"data/sample.jsonl" = 1.0
"data/wiki-id.jsonl" = 1.5
"data/fineweb2hq-id.jsonl" = 1.0
"data/cendol-wikihow-id.jsonl" = 1.0
"data/newspapers-2018-id.jsonl" = 1.0
"data/kopi-news-id.jsonl" = 1.0
"data/aya-id.jsonl" = 2.0
"data/culturax-id.jsonl" = 0.5
"data/cendol-puisi-id.jsonl" = 0.5

[model]
n_embd = 384
n_head = 6
n_layer = 6
block_size = 256
dropout = 0.1

[train]
batch_size = 32
max_iters = 5000
eval_interval = 200
eval_iters = 50
learning_rate = 3e-4
warmup_iters = 100
weight_decay = 0.1
grad_clip = 1.0
max_time = "60m"
out_dir = "checkpoints"
sample_tokens = 80
sample_prompt_chars = 24
sample_count = 4

[generate]
max_new_tokens = 256
temperature = 0.8
top_k = 50
top_p = 0.9
